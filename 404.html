<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Cristian Marino</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif:ital@1&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Shown by Vercel for any missing path. Same tokens as index.html, light and dark. */
    :root {
      --bg: #f6f5f2; --surface: #ffffff; --text: #16181d; --muted: #5b6475; --border: #e3e1dc; --heading: #14213d;
      --accent: #e8551c; --accent-text: #c2410c; --accent-ink: #16181d;
      --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0c111d; --surface: #141b2b; --text: #eef1f6; --muted: #a3abbd; --border: #24304a; --heading: #eef1f6; --accent: #ff7a45; --accent-text: #ff8a5c; }
    }
    :root[data-theme="dark"] { --bg: #0c111d; --surface: #141b2b; --text: #eef1f6; --muted: #a3abbd; --border: #24304a; --heading: #eef1f6; --accent: #ff7a45; --accent-text: #ff8a5c; }
    html[lang="es"] [data-l="en"], html[lang="en"] [data-l="es"] { display: none !important; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: radial-gradient(40% 50% at 70% 30%, rgba(232, 85, 28, .14), transparent 70%), var(--bg); color: var(--text); font: 400 1.05rem/1.6 var(--font-body); }
    main { max-width: 34rem; }
    .code { font: 800 clamp(4.5rem, 18vw, 8rem)/1 var(--font-display); letter-spacing: -0.05em; color: var(--accent); }
    h1 { margin: 14px 0 10px; font: 800 clamp(1.8rem, 5vw, 2.5rem)/1.1 var(--font-display); letter-spacing: -0.03em; color: var(--heading); }
    h1 em { font: italic 400 1.08em var(--font-serif, "Instrument Serif", serif); color: var(--accent-text); }
    p { color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 600; text-decoration: none; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-ghost { border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  </style>
  <script>
    /* Same language and theme preferences as the rest of the site */
    try {
      const l = localStorage.getItem('lang') || ((navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en');
      document.documentElement.lang = l;
      const th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th;
    } catch (e) {}
  </script>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1><span data-l="es">Esta página no <em>existe</em></span><span data-l="en">This page doesn't <em>exist</em></span></h1>
    <p data-l="es">Puede que el enlace esté mal escrito o que la página se haya movido.</p>
    <p data-l="en">The link may be mistyped, or the page may have moved.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/"><span data-l="es">Ir al inicio</span><span data-l="en">Go to the home page</span></a>
      <a class="btn btn-ghost" href="/#cv"><span data-l="es">Ver mi CV</span><span data-l="en">See my CV</span></a>
    </div>
  </main>
</body>
</html>
